const host = document.getElementById('host');
const tmpl = document.getElementById('tmpl').innerHTML;
function hid(s){ return '<span class="hid">'+s.replace(/[A-Z]+/g, m=>'<u>'+m+'</u>')+'</span>'; }
D.forEach((d,cur)=>{
  const st = document.createElement('div'); st.className='stage'; st.innerHTML = tmpl; host.appendChild(st);
  const q = s => st.querySelector(s);
  q('.title').textContent = d.group+' · '+d.name;
  let lastG=''; q('.devs').innerHTML = D.map((x,i)=>{const h = x.group!==lastG ? `<h6 class="${lastG?'sp':''}">${x.group}</h6>`:''; lastG=x.group; return h+`<div class="dev ${i===cur?'on':''} ${x.n===0?'zero':''}"><span>${x.name}</span><span class="n">${x.n}</span></div>`;}).join('');
  q('.ans').textContent = d.answer; q('.ansnum').textContent = d.num+' · '+d.enum;
  let html='';
  if(d.id==='deletion') html = `<div class="grp g-p2">${[...'ORCHESTRA'].map(c=>'<b>'+c+'</b>').join('')}</div><div class="grp g-x"><b>L</b></div>`;
  else if(d.id==='container') html = `<div class="grp g-p1"><b>S</b></div><div class="grp g-p2"><b>T</b><b>A</b><b>R</b></div><div class="grp g-p1"><b>E</b></div>`;
  else if(d.id==='reversal') html = `<div class="grp g-p2">${[...'STRESSED'].map(c=>'<b>'+c+'</b>').join('')}</div><span class="ex">← DESSERTS</span>`;
  else if(d.tiles) html = d.tiles.map(([p,c])=>`<div class="grp g-${c}">${[...p].map(ch=>'<b>'+ch+'</b>').join('')}</div>`).join('');
  else html = d.parts.map(([p,c])=>`<div class="grp g-${c}">${[...p].map(ch=>'<b>'+ch+'</b>').join('')}</div>`).join('');
  q('.tiles').innerHTML = html;
  q('.splits').innerHTML = d.splits.map((s,i)=>`<span class="split ${i===0?'on':''}">${s}</span>`).join('');
  q('.ex').textContent = d.answer!=='ORCHESTRA' ? 'Shown with '+d.answer : '';
  q('.draft').innerHTML = d.draft; q('.enum').textContent='('+d.enum+')'; q('.readsx').innerHTML='Reads as: '+d.reads;
  q('.bank').innerHTML = d.cols.map(c=>{const total=c.groups.reduce((a,g)=>a+g[1].length,0);
    return `<div class="col ${c.cls} ${c.wide?'wide':''}"><h5><span>${c.title}</span><span class="cnt">${total}</span></h5><div class="list">`+
    c.groups.map(([gname,items])=>`<div class="g">${gname}</div><div class="items">`+items.map(it=>`<button class="it ${it===c.pick?'on':''}">${c.hidden?hid(it):it}</button>`).join('')+'</div>').join('')+'</div></div>';}).join('');

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const btn = document.getElementById('theme');
const setT = d => { document.querySelectorAll('.app').forEach(a=>a.classList.toggle('dark',d)); btn.textContent = d?'Light mode':'Dark mode'; fit(); };
btn.onclick = () => setT(!document.querySelector('.app').classList.contains('dark'));
function fit(){document.querySelectorAll('.stage').forEach(st=>{const a=st.querySelector('.app');const s=Math.min(1,st.clientWidth/1182);a.style.transform=`scale(${s})`;const t=st.querySelector('.title');st.style.height=((t?t.offsetHeight+30:0)+a.offsetHeight*s+4)+'px';});}
addEventListener('resize',fit);addEventListener('load',fit);document.fonts&&document.fonts.ready.then(fit);
setT(dark);
