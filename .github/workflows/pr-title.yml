# A pull request's title becomes its commit on main (squash merges), and
# release-plz reads those to choose the next version, so titles must follow
# Conventional Commits: feat: …, fix(engine): …, chore: …
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  check:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
