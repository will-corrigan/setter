# Releases, run by release-plz (config: release-plz.toml).
#
# On each push to main a small Linux job updates the Release PR: the next
# version, worked out from commit messages, and the changelog. Nothing is
# built and nothing is released until that PR is merged. Merging it tags
# vX.Y.Z and publishes the GitHub Release, and then the Windows installer
# (.exe) is built and attached to it.
#
# By hand (Actions → Release → Run workflow): with a tag, (re)build that
# release's installer and attach it; without one, build the chosen branch as a
# test and keep the installer only as a workflow artifact.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the installer for (e.g. v0.1.0); leave empty to test-build the branch"
        required: false
        default: ""

jobs:
  release-pr:
    name: Update the Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release (when the Release PR is merged)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(jq -r '[.[] | select(.package_name == "setter")][0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  # Runs in this workflow, not one triggered by the release: releases made
  # with GITHUB_TOKEN don't start other workflows.
  #
  # dx builds the app (setter.exe and its assets); Velopack's vpk packs that
  # folder into Setter-win-Setup.exe plus the update packages the installed app
  # downloads (see app/src/updater.rs). vpk's version must match the velopack
  # crate in app/Cargo.toml.
  windows:
    name: Windows installer
    needs: release
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release.outputs.created == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
      VPK_VERSION: "1.2.161"
      REPO_URL: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: jdx/mise-action@v4
      - name: Build the app
        working-directory: app
        run: dx build --platform desktop --release
      - name: Work out the version and the app's folder
        run: |
          version="${TAG#v}"
          if [ -z "$version" ]; then
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          fi
          exe=$(find target/dx -path '*release*' -name setter.exe | head -n 1)
          [ -n "$exe" ] || { echo "::error::setter.exe not found under target/dx"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_DIR=$(dirname "$exe")" >> "$GITHUB_ENV"
          ls "$(dirname "$exe")"
      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"
      - name: Fetch the previous release, for smaller updates
        if: env.TAG != ''
        run: vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" || echo "No earlier Velopack release."
      - name: Pack
        run: >-
          vpk pack --packId Setter --packVersion "$VERSION" --packDir "$APP_DIR"
          --mainExe setter.exe --packTitle Setter --packAuthors "Will Corrigan"
          --icon app/icons/icon.ico --outputDir Releases
      - name: Keep it with the run
        uses: actions/upload-artifact@v4
        with:
          name: setter-windows
          path: Releases/
      - name: Attach it to the release
        if: env.TAG != ''
        run: >-
          vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN"
          --tag "$TAG" --merge --publish --releaseName "Setter $VERSION"
