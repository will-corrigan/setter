[workspace]
resolver = "2"
members = ["crates/engine", "app"]

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package.xw-engine]
opt-level = 3
